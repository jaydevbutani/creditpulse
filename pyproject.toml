[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "creditpulse"
version = "1.0.0"
description = "Temporal deep learning for early loan-default prediction on the Berka dataset"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0", "pyarrow", "numpy", "scikit-learn>=1.3", "lightgbm", "xgboost",
  "torch>=2.1", "scikit-survival", "shap", "optuna", "pandera", "pyyaml",
  "fastapi", "pydantic>=2", "uvicorn", "streamlit", "plotly", "matplotlib", "httpx", "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
